name: homearpa

services:
  wireguard:
    image: lscr.io/linuxserver/wireguard
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - "51820:51820/udp"
    volumes:
      - ./data/wireguard:/config
      - /lib/modules:/lib/modules:ro
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - SERVERURL=192.168.0.135   # later you can change to public IP / domain
      - SERVERPORT=51820
      - PEERS=1                  # number of client configs to generate
      - PEERDNS=192.168.0.135    # CoreDNS
      - INTERNAL_SUBNET=10.13.13.0
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped

# docker compose -f docker-compose.wireguard.yml up -d
# client configs will appear here
# ./data/wireguard/peer1/
