name: homearpa

networks:
  proxy:
    name: proxy
    driver: bridge

services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    ports:
      - "80:80"       # HTTP → redirect to HTTPS
      - "443:443"     # HTTPS apps and dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/traefik/cert.pem:/certs/cert.pem:ro
      - ./data/traefik/key.pem:/certs/key.pem:ro
      - ./data/traefik/traefik.yml:/traefik.yml:ro
      - ./data/traefik/dynamic:/dynamic:ro
    networks:
      - proxy
    restart: unless-stopped
    labels:
      # expose dashboard over HTTPS
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.home.arpa`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls=true
      - traefik.http.routers.traefik.service=api@internal

