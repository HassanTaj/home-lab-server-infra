# Install to /etc/systemd/system/docker.service.d/10-after-netbird.conf
#
# Docker auto-restarts containers with `restart: unless-stopped` when the daemon
# starts. Every homelab service publishes its port on the NetBird address
# 100.64.0.10, which only exists once NetBird has created wt0.
#
# On YYYY-MM-DD Docker started at 20:35:38 while wt0 was not created until later.
# Docker cannot bind an address that does not exist, so it silently dropped the
# publish: the containers came up "healthy" with NO published ports, and
# home.example.com returned 502 while nginx sat there perfectly fine.
#
# The homelab units already carry After=netbird.service, but that is bypassed at
# boot because *Docker* starts the containers, not systemd. Ordering the daemon
# itself is what closes that gap.
#
# Wants=, not Requires=: if NetBird fails, Docker must still start. Containers
# binding loopback (PostgreSQL) work regardless, and the watchdog repairs the rest.
[Unit]
After=netbird.service
Wants=netbird.service
