# Homelab memory tuning. Install to /etc/sysctl.d/99-homelab-memory.conf
#
# swappiness 60 is the desktop default and is too eager for this host: on
# an earlier deployment it had pushed 1.3 GB into swap while 3.4 GB was still available,
# and the swap partition sits on a budget system disk where paging
# is both slow and a wear cost. 10 keeps the working set resident and only pages
# under genuine pressure. It is not 0: some swap is wanted as a safety margin on
# a low-memory host, and 0 invites the OOM killer instead.
vm.swappiness = 10

# Keep dentry/inode caches longer. This host walks very large directory trees
# (a large media library) and re-walking them is slow over
# USB 2.0, so caching metadata pays for itself.
vm.vfs_cache_pressure = 50
