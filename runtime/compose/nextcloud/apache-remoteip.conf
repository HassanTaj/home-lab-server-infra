# Restore the real client IP behind edge VPS Traefik.
#
# Mounted into /etc/apache2/conf-enabled/ by the nextcloud compose file.
#
# WHY THIS FILE EXISTS
# The image ships its own remoteip config, but it trusts only RFC1918 ranges
# (10/8, 172.16/12, 192.168/16). edge VPS reaches this container from its NetBird
# address 100.64.0.11, which is in the CGNAT range 100.64.0.0/10 and therefore
# NOT trusted by that default. The result is that REMOTE_ADDR stays the proxy's
# address for every request, so Nextcloud's brute-force protection buckets all
# users together — useless as protection, and able to throttle everyone at once.
#
# APACHE_DISABLE_REWRITE_IP=1 stays set in nextcloud.env so the image's own
# (wrongly scoped) config is off and this one is authoritative.
#
# The trusted proxy is deliberately a single address, not a range. Widening it
# would let any host on the overlay spoof X-Forwarded-For and forge its client
# IP, defeating brute-force protection and poisoning the audit log.

<IfModule remoteip_module>
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 100.64.0.11
</IfModule>

# Log the rewritten client address rather than the proxy's.
<IfModule log_config_module>
    LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" homelab_combined
    CustomLog /proc/self/fd/1 homelab_combined
</IfModule>
