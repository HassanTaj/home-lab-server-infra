# Bound Apache's worker count so it cannot outrun the two hard limits around it.
#
# The image ships MaxRequestWorkers 150 (Debian's prefork default). On this host
# that is actively harmful, and both failures were observed on YYYY-MM-DD:
#
#   1. MEMORY. The container is capped at 2048m. A burst to ~114 workers pushed
#      cgroup memory.peak to 2.1G against memory.max 2.0G and the container was
#      OOM-killed (docker inspect reported OOMKilled=true). Measured marginal
#      cost is ~13 MB per worker (11 workers ~= 0.8G, 114 workers ~= 2.1G).
#
#   2. DATABASE. PostgreSQL runs with max_connections=100. Apache asking for up
#      to 150 concurrent connections guarantees "FATAL: sorry, too many clients
#      already" under load -- observed at 105 connections. That breaks page
#      loads AND can refuse the nightly pg_dump, so a busy evening could cost a
#      backup. Backups matter more than peak concurrency here.
#
# 48 workers is chosen so that:
#   - memory stays near 0.6G + 48*13MB ~= 1.2G, well inside the 2048m cap,
#   - at most 48 web connections leaves ~50 of PostgreSQL's 100 for the cron
#     container, the backup job and admin access,
#   - 4 CPUs are already oversubscribed at 48 concurrent PHP requests, and this
#     host serves a handful of accounts.
#
# Raising this REQUIRES raising max_connections and the container memory limit
# together; see "If we need more connections" in the README.
<IfModule mpm_prefork_module>
    StartServers             4
    MinSpareServers          4
    MaxSpareServers          8
    MaxRequestWorkers       48
    # Recycle children. mod_php leaks across requests, so long-lived workers
    # drift upwards and are what pushed the container over its cap.
    MaxConnectionsPerChild 1000
</IfModule>
