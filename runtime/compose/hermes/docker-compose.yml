name: homelab-hermes

services:
  hermes:
    image: nousresearch/hermes-agent:v2026.9.14@sha256:99641e57ec762c59e54cb44aa6746b7fc68c18b3c5ddb088af54234c613d9294
    profiles: [cli]
    depends_on:
      ollama:
        condition: service_healthy
    stdin_open: true
    tty: true
    volumes:
      - /srv/homelab/appdata/hermes:/opt/data
    environment:
      TZ: Asia/Karachi
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ollama:
    image: ollama/ollama:0.34.1@sha256:0c0a83210471fb50226bcdc2d6611d20ab13ae87e024cc304c94a6a5765c5e65
    profiles: [cli, home-assistant]
    volumes:
      - /srv/homelab/appdata/ollama:/root/.ollama
    environment:
      TZ: Asia/Karachi
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "65536"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    mem_limit: 7g
    cpus: 2.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  hermes-api:
    image: nousresearch/hermes-agent:v2026.9.14@sha256:99641e57ec762c59e54cb44aa6746b7fc68c18b3c5ddb088af54234c613d9294
    profiles: [home-assistant]
    command: ["gateway", "run"]
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - /srv/homelab/appdata/hermes:/opt/data
    environment:
      TZ: Asia/Karachi
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
    ports:
      - "127.0.0.1:8642:8642"
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
