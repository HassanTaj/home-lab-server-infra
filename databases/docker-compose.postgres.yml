name: databases

services:
  # Postgres + PostGIS
  postgres:
    image: postgis/postgis:18-3.6  # PostgreSQL 18 + PostGIS 3.6
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql  # ✅ required for Postgres 18+
    networks:
      - postgres-network
      - proxy
    healthcheck:  # ensures container is ready before pgAdmin connects
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: YourStrong!Passw0rd
      PGADMIN_CONFIG_SERVER_MODE: "False"       # single-user / desktop mode
      # PGADMIN_LISTEN_ADDRESS: "0.0.0.0"         # bind IPv4 to host
      # PGADMIN_ENABLE_TLS: "False"
      # PGADMIN_CONFIG_ENFORCE_HTTPS: "False"
    # ports:
    #   - "443:443"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - postgres-network
      - proxy
    labels:
    - traefik.enable=true
    - traefik.docker.network=proxy
    - traefik.http.routers.pgadmin.rule=Host(`pgadmin.home.arpa`)
    - traefik.http.routers.pgadmin.entrypoints=websecure
    - traefik.http.routers.pgadmin.tls=true
    - traefik.http.services.pgadmin.loadbalancer.server.port=80

volumes:
  postgres-data:
  pgadmin-data:

networks:
  postgres-network:
    driver: bridge
  proxy:
    external: true
