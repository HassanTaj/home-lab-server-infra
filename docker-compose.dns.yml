name: homearpa

services:
  coredns:
    image: coredns/coredns
    container_name: coredns
    command: -conf /Corefile
    volumes:
      - ./config/Corefile:/Corefile:ro
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    restart: unless-stopped


