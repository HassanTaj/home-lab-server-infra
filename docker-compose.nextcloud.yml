name: homearpa

networks:
  proxy:
    external: true

services:
  nextcloud:
    image: nextcloud
    container_name: nextcloud
    environment:
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.home.arpa

    volumes:
      - ./data/nextcloud/html:/var/www/html
      - ./data/nextcloud/config:/var/www/html/config
      - ./data/nextcloud/apps:/var/www/html/custom_apps
      - ./data/nextcloud/data:/var/www/html/data

    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud.rule=Host(`nextcloud.home.arpa`)
      - traefik.http.routers.nextcloud.entrypoints=websecure
      - traefik.http.routers.nextcloud.tls=true
      - traefik.http.routers.nextcloud.tls.certresolver=selfsigned
      - traefik.http.services.nextcloud.loadbalancer.server.port=80

    networks:
      - proxy
    restart: unless-stopped
